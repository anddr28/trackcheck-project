# Сборка сайта на Astro и публикация на GitHub Pages.
# В настройках репозитория: Settings → Pages → Source: «GitHub Actions» (не «Deploy from a branch»,
# иначе GitHub запускает Jekyll по исходникам и падает на файлах .astro).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Тесты детектора
        run: npm test

      - name: Сборка сайта
        run: npm run build
        env:
          # Сайт живёт по адресу https://<владелец>.github.io/<репозиторий>/
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
